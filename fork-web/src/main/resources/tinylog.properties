# fork-web: forge-gui's tinylog.properties, except that NETWORK-tagged INFO and below
# (DeltaSyncManager logs every flush) stays off the console. This file comes first on the
# module's classpath, so it replaces forge-gui's for the web server and its tests.
writerdefault        = console
writerdefault.level  = info
writerdefault.tag    = -, ENGINE, GUI, AI
writerdefault.format = {date: HH:mm:ss} [{level|min-size=5}] {class-name}: {message}

writerNetConsole        = console
writerNetConsole.level  = warn
writerNetConsole.tag    = NETWORK
writerNetConsole.format = {date: HH:mm:ss} [{level|min-size=5}] {class-name}: {message}

# Suppress noisy libraries (they flood at DEBUG/TRACE)
level@io.netty           = warn
level@org.jupnp          = warn
level@org.eclipse.jetty  = warn

# Network file writer - routes to per-instance files via thread context
writerNetFile        = network log
writerNetFile.tag    = NETWORK
writerNetFile.level  = trace
writerNetFile.format = {date: HH:mm:ss.SSS} [{level|min-size=5}] {class-name}: {message}{exception}
