<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge Spike Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%221%22 width=%2210%22 height=%2214%22 rx=%222%22 fill=%22%232f5fb3%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <strong>Forge</strong> <span class="muted">web-bridge spike · read-only</span>
    </div>
    <div class="turn" id="turn">waiting for game…</div>
    <div class="conn">
      <label class="toggle"><input type="checkbox" id="images"> card images</label>
      <span id="status" class="pill">connecting</span>
      <span id="stats" class="muted mono"></span>
    </div>
  </header>
  <main class="layout">
    <section id="players" class="players" aria-label="Players"></section>
    <aside class="side">
      <section class="panel">
        <h2>Stack</h2>
        <ol id="stack" class="stack"></ol>
      </section>
      <section class="panel">
        <h2>Combat</h2>
        <ul id="combat" class="combat"></ul>
      </section>
      <section class="panel grow">
        <h2>Log</h2>
        <ol id="log" class="log"></ol>
      </section>
    </aside>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
